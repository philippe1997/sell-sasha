server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

cloudinary.api-base-url=${CLOUDINARY_API_BASE_URL:https://api.cloudinary.com/v1_1}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.categories=${CLOUDINARY_CATEGORIES:buc\u0103t\u0103rie,camer\u0103 tineret,comode \u0219i noptiere,dressing,diverse,dulap sub scar\u0103,living,paturi de mijloc}
cloudinary.folder-field=${CLOUDINARY_FOLDER_FIELD:asset_folder}
cloudinary.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
cloudinary.page-size=${PHOTO_PAGE_SIZE:40}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s
